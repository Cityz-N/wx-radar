name: Publish radar

# How it runs: each run waits until Meteo-France offers a frame newer than the one on your
# site, converts it and publishes it right away. When it is done, a second job starts the
# next run ("chain"), which then waits for the following frame.
# The 15-minute schedule below is only a safety net that restarts the chain if it ever stops.
# To stop everything: Actions tab > Publish radar > "..." menu > Disable workflow.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Publish right now, even if there is no new frame"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: radar-chain
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install requests numpy h5py pillow pyproj

      - name: Wait for a new Meteo-France frame and convert it
        id: convert
        env:
          MF_API_KEY: ${{ secrets.MF_API_KEY }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          FORCE: ${{ inputs.force }}
          MAX_WAIT_SECONDS: "420"
        run: python convert.py

      - name: Prepare the site
        if: steps.convert.outputs.published == 'true'
        uses: actions/configure-pages@v5

      - name: Upload the site
        if: steps.convert.outputs.published == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Publish the site
        id: deployment
        if: steps.convert.outputs.published == 'true'
        uses: actions/deploy-pages@v4

  next:
    # Starts the next run once this one has finished publishing (or failed, or found nothing new),
    # so that the chain never stops because of one bad run.
    needs: publish
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Short pause, then start the next run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          sleep 45
          for i in 1 2 3 4 5; do
            if gh workflow run radar.yml --repo "$REPO" --ref "$REF"; then
              echo "next run requested"
              exit 0
            fi
            echo "attempt $i failed, retrying"
            sleep 10
          done
          echo "could not request the next run"
          exit 1
