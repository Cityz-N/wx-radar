name: Discover Meteo-France radar format

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev || true
          pip install requests numpy h5py eccodes

      - name: Run discovery
        env:
          MF_API_KEY: ${{ secrets.MF_API_KEY }}
        run: python discover.py
